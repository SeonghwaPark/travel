name: explore-weekly

# 정기 탐색. explore_watchlist.json의 질문들을 주 1회 같은 조건으로 다시 돌려
# explore/history/에 시계열을 쌓는다. 이 이력이 있어야 "지금 가격이 싼가"에
# 답할 수 있다 — 1회성 스캔은 순위만 알려줄 뿐 그 질문에 답하지 못한다.
#
# 주 1회인 이유: 항공권 가격은 하루 단위로 의미 있게 움직이지 않고, 목적지
# 29곳 × 박수만큼 요청이 나가 매일 돌리면 차단 위험이 커진다.

on:
  schedule:
    # 일요일 00:20 UTC = 월요일 09:20 KST. fare-watch(00:00)와 겹치지 않게 어긋냈다.
    - cron: "20 0 * * 0"
  workflow_dispatch:
    inputs:
      only:
        description: "특정 질문 id만 실행 (비우면 전체)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: explore-weekly
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-watch.txt

      - name: Run standing exploration
        env:
          IN_ONLY: ${{ inputs.only }}
        run: |
          ARGS=()
          if [ -n "$IN_ONLY" ]; then ARGS+=(--only "$IN_ONLY"); fi
          python -m explore.standing "${ARGS[@]}"

      - name: Commit results and history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add explore/results/ explore/history/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 정기 탐색 결과 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi

      - name: Summary
        if: always()
        run: |
          for f in explore/results/*.md; do
            [ -e "$f" ] || continue
            cat "$f" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done
